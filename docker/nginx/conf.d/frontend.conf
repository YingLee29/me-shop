# ── Nginx reverse proxy cho Next.js Frontend (container 3000 → host 5000) ──
server {
    listen 3000;
    server_name localhost;

    # Docker DNS: phân giải lại tên container khi frontend bị recreate
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream frontend:3000;

    # Tăng timeout cho Next.js dev server (hot reload chậm)
    proxy_read_timeout 300;
    proxy_connect_timeout 300;

    location / {
        proxy_pass         http://$frontend_upstream;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    access_log /var/log/nginx/frontend_access.log;
    error_log  /var/log/nginx/frontend_error.log;
}
