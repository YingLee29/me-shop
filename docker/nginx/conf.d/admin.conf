# ── Nginx reverse proxy cho Next.js Admin (container 3001 → host 5002) ──
server {
    listen 3001;
    server_name localhost;

    # Docker DNS: phân giải lại tên container khi admin bị recreate
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $admin_upstream admin:3001;

    # Tăng timeout cho Next.js dev server (hot reload chậm)
    proxy_read_timeout 300;
    proxy_connect_timeout 300;

    location / {
        proxy_pass         http://$admin_upstream;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    access_log /var/log/nginx/admin_access.log;
    error_log  /var/log/nginx/admin_error.log;
}
